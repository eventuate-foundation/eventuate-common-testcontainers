buildscript {
    repositories {
        mavenCentral()
        maven {
          url "https://plugins.gradle.org/m2/"
        }
        eventuateMavenRepoUrl.split(',').each { repoUrl -> maven { url repoUrl } }
    }
    dependencies {
        classpath "io.eventuate.plugins.gradle:eventuate-plugins-gradle-publish:$eventuatePluginsGradleVersion"
    }
    configurations.all {
        resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
    }
}


apply plugin: "io.eventuate.plugins.gradle.publish.EventuatePublish"

// The root project is not a module, but the publish plugin would publish it as an empty eventuate-common-testcontainers jar
tasks.withType(PublishToMavenRepository).configureEach {
    enabled = false
}

allprojects {
    group = "io.eventuate.common.testcontainers"
}

subprojects {
    java {
        toolchain {
            languageVersion.set(JavaLanguageVersion.of(17));
        }
    }

    repositories {
        mavenCentral()
        eventuateMavenRepoUrl.split(',').each { repoUrl -> maven { url repoUrl } }
    }

    if (!project.name.endsWith("-bom")) {
        dependencies {
            testImplementation "org.assertj:assertj-core:$assertjVersion"
            testImplementation "org.junit.jupiter:junit-jupiter:$junitVersion"
            testRuntimeOnly "org.junit.platform:junit-platform-launcher:$junitPlatformLauncherVersion"
        }

        // The modules were published as io.eventuate.common:<module> by eventuate-common.
        // Declaring that capability makes a build that gets both fail with a capability conflict
        // instead of putting two jars with the same classes on the classpath.
        configurations.matching { it.name in ["apiElements", "runtimeElements"] }.configureEach {
            outgoing.capability("${project.group}:${project.name}:${project.version}")
            outgoing.capability("io.eventuate.common:${project.name}:${project.version}")
        }
    }
}

configurations.all {
    resolutionStrategy.cacheDynamicVersionsFor 10, 'minutes'
    resolutionStrategy.cacheChangingModulesFor 10, 'seconds'
}

task compileAll {
    dependsOn subprojects.collect { it.tasks.withType(JavaCompile) }.flatten()
}

task preCommitCheck {
    dependsOn compileAll
    doLast {
        exec {
            commandLine 'circleci', 'config', 'validate'
        }
    }
}
tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
